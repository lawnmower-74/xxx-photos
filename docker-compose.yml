services:
  db:
    image: mysql:8.0
    container_name: db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: xxx_photos
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: redis
    volumes:
      - redis_data:/data

  app:
    build: .
    container_name: app
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
    environment:
      DATABASE_PASSWORD: password
      REDIS_URL: redis://redis:6379/1

  sidekiq:
    build: .
    container_name: sidekiq
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - .:/app
    depends_on:
      - db
      - redis
    environment:
      DATABASE_PASSWORD: password
      REDIS_URL: redis://redis:6379/1

  similarity_api:
    build: ./go_api
    container_name: similarity_api
    expose:
      - "8080"
    depends_on:
      - db
    environment:
      DB_USER: root
      DB_PASSWORD: password
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: xxx_photos

volumes:
  db_data:
  redis_data: